services:
  postgres:
    ports:
      - '${DB_PORT:-5432}:5432'
    restart: 'no'

  app:
    build:
      target: development
    init: true
    volumes:
      - ./src:/app/apps/api/src
      - ../../packages/constants/src:/app/packages/constants/src
      - ../../packages/schemas/src:/app/packages/schemas/src
    # turbo runs the package's tsc --watch next to nest --watch, like pnpm dev:api.
    # -C keeps the image's WORKDIR, so `compose exec app pnpm run <script>` stays in apps/api.
    command: pnpm -C /app exec turbo run dev --filter=api...
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      TSC_WATCHFILE: UsePollingDelay
    restart: 'no'
