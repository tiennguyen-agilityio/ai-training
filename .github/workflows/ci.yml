name: Docker CI/CD

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.dockerignore'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.dockerignore'
      - '.github/workflows/**'

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    outputs:
      api_affected: ${{ steps.api.outputs.affected }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve turbo base
        id: base
        run: |
          case "${{ github.event_name }}" in
            pull_request) BASE="${{ github.event.pull_request.base.sha }}" ;;
            push) BASE="${{ github.event.before }}" ;;
          esac
          if [ -n "$BASE" ] && git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            echo "TURBO_SCM_BASE=$BASE" >> "$GITHUB_ENV"
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "Base '$BASE' is missing, all zeros or unreachable; running every package"
            echo "usable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build
        run: |
          if [ "${{ steps.base.outputs.usable }}" = "true" ]; then
            pnpm exec turbo run test build --affected
          else
            pnpm exec turbo run test build
          fi

      - name: Is the API affected?
        id: api
        run: |
          if [ "${{ steps.base.outputs.usable }}" != "true" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$TURBO_SCM_BASE" HEAD -- .github/workflows .dockerignore | grep -q .; then
            echo "affected=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          json=$(pnpm exec turbo ls --affected --output=json)
          if printf '%s' "$json" | jq -e '.packages.items | any(.name == "api")' >/dev/null; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            [ "$rc" -eq 1 ] || { echo "jq failed with exit $rc on turbo ls output" >&2; exit "$rc"; }
            echo "affected=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-scan:
    needs: quality
    if: needs.quality.outputs.api_affected == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (local only, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  push-develop:
    needs: [quality, build-and-scan]
    if: needs.quality.outputs.api_affected == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop'))
    runs-on: ubuntu-latest
    environment: develop-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:develop
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-production:
    needs: [quality, build-and-scan]
    if: needs.quality.outputs.api_affected == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: meta
        run: |
          SHA="${{ github.sha }}"
          TAGS="${{ env.IMAGE_NAME }}:$SHA,${{ env.IMAGE_NAME }}:latest"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-develop:
    needs: push-develop
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: develop-deploy
    steps:
      - name: Trigger Render deploy
        run: |
          curl --fail -X POST "https://api.render.com/v1/services/${{ vars.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"

  deploy-production:
    needs: push-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ vars.AUTO_DEPLOY == 'true' && 'render-auto' || 'render-manual' }}
    steps:
      - name: Trigger Render deploy
        run: |
          curl --fail -X POST "https://api.render.com/v1/services/${{ vars.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"
